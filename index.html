<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBGIS IBF - BBMKG IV</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Modular CSS (Clean Light Theme V1.1) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/legend.css">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <!-- Kontainer Peta Utama (Wajib Paling Belakang) -->
    <div id="map"></div>

    <!-- 1. Header Utama -->
    <div class="map-header">
        <h3 id="systemSubtitle">Memuat sistem...</h3>
        <h1 id="hazardTitle">Prediksi Risiko Dampak IBF BBMKG IV</h1>
        <p id="validDateText">Valid: Memuat data...</p>
    </div>

    <!-- 2. Logo di Ujung Kanan Atas -->
    <div class="logo-container">
        <img src="assets/logo.jpeg" alt="Logo BMKG" class="logo-instansi" onerror="this.style.display='none'">
    </div>

    <!-- 3. Kontrol Kiri Atas (Menu Dropdown Berjejer Vertikal Ke Bawah) -->
    <div class="top-left-controls">
        <!-- Map Settings Dropdown -->
        <div class="dropdown-wrapper" id="mapSettingsDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('mapSettingsDropdown')">🗺️ Map Settings ▾</button>
            <div class="dropdown-content">
                <button onclick="changeBasemap('dark')">🌙 Dark Matter (Gelap)</button>
                <button onclick="changeBasemap('streets')">🛣️ OpenStreetMap (Standar)</button>
                <button onclick="changeBasemap('positron')">☀️ CartoDB Positron (Terang)</button>
                <button onclick="changeBasemap('voyager')">🗺️ CartoDB Voyager (Jalan)</button>
                <button onclick="changeBasemap('satellite')">🛰️ Esri World Imagery (Satelit)</button>
                <button onclick="changeBasemap('topo')">⛰️ OpenTopoMap (Topografi)</button>
            </div>
        </div>

        <!-- Potensi Bahaya (Hazard) -->
        <div class="dropdown-wrapper" id="hazardDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('hazardDropdown')">⚡ Potensi Bahaya ▾</button>
            <div class="dropdown-content">
                <button onclick="switchProduct('hazard', 'angin')">Angin Kencang</button>
                <button onclick="switchProduct('hazard', 'banjir')">Banjir</button>
                <button onclick="switchProduct('hazard', 'longsor')">Longsor</button>
                <button onclick="switchProduct('hazard', 'suhu')">Heat Stress Udara Panas</button>
                <button onclick="switchProduct('hazard', 'snorkling')">Keamanan Snorkling</button>
                <button onclick="switchProduct('hazard', 'diving')">Keamanan Diving</button>
            </div>
        </div>

        <!-- Dampak Risiko -->
        <div class="dropdown-wrapper" id="risikoDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('risikoDropdown')">⚠️ Dampak Risiko ▾</button>
            <div class="dropdown-content">
                <button onclick="switchProduct('risiko', 'risiko_banjir')">Risiko Dampak Banjir</button>
                <button onclick="switchProduct('risiko', 'risiko_longsor')">Risiko Dampak Longsor</button>
                <button onclick="switchProduct('risiko', 'risiko_snorkling')">Risiko Keamanan Snorkling</button>
                <button onclick="switchProduct('risiko', 'risiko_diving')">Risiko Keamanan Diving</button>
            </div>
        </div>

        <!-- Tombol Fullscreen -->
        <div class="dropdown-wrapper">
            <button class="dropdown-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
    </div>

    <!-- 4. Kotak Kontrol Kiri Bawah (Mendukung Collapsible Panel) -->
    <div class="control-box left-bottom-panel" id="mobilePanel">
        <!-- Header Mobile dengan Tombol Toggle -->
        <div class="panel-header-mobile" onclick="toggleMobilePanel()">
            <h4>Panel Kontrol & Navigasi Waktu</h4>
            <button id="togglePanelBtn" class="btn-toggle-panel" aria-label="Toggle Panel">▼</button>
        </div>

        <!-- Isi Konten Panel -->
        <div class="panel-body-content" id="panelBody">
            <div class="time-controls">
            <!-- Navigasi Waktu Prediksi -->
            <h4>_____________________________________</h4>
                <div class="button-group" id="dayButtonsContainer"></div>
                <div class="nav-playback-group">
                    <button class="action-btn" onclick="prevStep()">&laquo; Prev</button>
                    <button class="action-btn" id="playBtn" onclick="togglePlay()">&#9658; Play</button>
                    <button class="action-btn" onclick="nextStep()">Next &raquo;</button>
                </div>
            </div>

            <hr class="panel-divider">

            <!-- Slider Transparansi Peta -->
            <div class="opacity-control">
                <label for="opacityRange">
                    Transparansi Peta: <span id="opacityVal">65%</span>
                </label>
                <input type="range" id="opacityRange" min="0" max="100" step="1" value="65" oninput="updateOpacity(this.value)">
            </div>

            <hr class="panel-divider">

            <!-- Legenda Peringatan -->
            <h4>Legenda Peringatan</h4>
            <div id="legendBox" class="legend-container"></div>

            <!-- Watermark Pengembang -->
            <div class="dev-watermark">Pengembang: Bagus Primohadi - BBMKG IV</div>
        </div>
    </div>

    <!-- LEAFLET JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- MODUL JAVASCRIPT V1.1 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
    <script src="js/basemap.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/legend.js"></script>
    <script src="js/overlay.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/opacity.js"></script>
    <script src="js/fullscreen.js"></script>
    <script src="js/hover.js"></script>
    <script src="js/search.js"></script>
    <script src="js/urlstate.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
